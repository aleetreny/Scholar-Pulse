name: Evaluate mature ranking cohorts

on:
  workflow_dispatch:
  schedule:
    # The first original cohort matures on Saturday 2026-11-21 at 15:06 UTC.
    - cron: "30 18 * * 6"

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Evaluate only cohorts at least 90 days old
        run: node scripts/verify-ranking.mjs --output ranking-audit.json
        working-directory: apps/web
        env:
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: ranking-audit-${{ github.run_id }}
          path: apps/web/ranking-audit.json
          retention-days: 90
