name: Deploy web app to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # Refresh feed snapshots once a week, after arXiv's Monday announcement.
    - cron: "20 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Generous on purpose, because every slow part of this job is slow at
    # somebody else's discretion. The arXiv pass is paced at one request every
    # 3.2s by arXiv's own request and normally takes four minutes, but has been
    # seen to take twenty when arXiv is busy; enrichment then spends up to four
    # more waiting politely on two indexes that throttle anonymous callers.
    # Neither is worth failing a deploy over, and the enrichment budget caps the
    # part we control regardless.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/web

      - name: Check the ranking maths
        run: npm test
        working-directory: apps/web

      - name: Build feed snapshots from arXiv
        run: node scripts/build-feed-snapshots.mjs
        working-directory: apps/web

      # Scores the snapshots and folds this batch into the site's memory of
      # authors and vocabulary, which the next build fetches back from the
      # deployed site. Enrichment failures degrade the ranking rather than
      # failing the deploy, so this step is safe to keep in the critical path.
      - name: Rank the snapshots
        run: node scripts/rank-snapshots.mjs
        working-directory: apps/web
        env:
          SITE_BASE_URL: https://aleetreny.github.io/Scholar-Pulse

      - name: Build static site
        run: npm run build
        working-directory: apps/web
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
