name: Deploy web app to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # Refresh feed snapshots once a week, after arXiv's Monday announcement.
    - cron: "20 2 * * 1"
  workflow_dispatch:
    inputs:
      backfill_months:
        description: >-
          Months of arXiv history to fold into the corpus memory before
          ranking. 0 skips it. Safe to re-run: months already folded are
          recorded in the memory and skipped, and each run stops on a month
          boundary after half an hour, so several dispatches finish a long
          backfill and every one of them publishes its progress.
        default: "0"
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Headroom, not a measured need. The arXiv pass is paced at one request
    # every 3.2s by arXiv's own request; it now pages back ten days for the
    # corpus rather than taking a single page per category, which is roughly
    # 125 requests and seven minutes against four. Ranking takes under six,
    # bounded by its own enrichment budget rather than by this cap. Thirteen or
    # fourteen minutes is the realistic run. The margin is here because the
    # upstreams throttle anonymous callers at their own discretion, and a
    # deploy killed mid-flight costs more than one that runs long. The cap is
    # 90 rather than 45 because a manual dispatch may also spend half an hour
    # backfilling the corpus memory before any of that starts.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/web

      - name: Check the ranking maths
        run: npm test
        working-directory: apps/web

      # Writes two things: the hundred papers per category the site displays,
      # under public/data/feed, and everything submitted in the last ten days
      # under apps/web/.corpus, which the ranker folds into its memory and
      # nothing serves.
      # Optional and manual. The author signals carry 45% of the model's
      # weight and are dead weight until the memory has seen the field, which
      # the weekly harvest reaches at about 8,000 papers a week; this buys the
      # same history in months rather than years. Costs about 160 bytes of
      # memory.json per paper folded.
      - name: Backfill the corpus memory
        if: >-
          github.event_name == 'workflow_dispatch'
          && github.event.inputs.backfill_months != ''
          && github.event.inputs.backfill_months != '0'
        run: node scripts/backfill-memory.mjs --months ${{ github.event.inputs.backfill_months }}
        working-directory: apps/web

      - name: Build feed snapshots from arXiv
        run: node scripts/build-feed-snapshots.mjs
        working-directory: apps/web

      # Scores the snapshots and folds this batch into the site's memory of
      # authors and vocabulary, which the next build fetches back from the
      # deployed site. Enrichment failures degrade the ranking rather than
      # failing the deploy, so this step is safe to keep in the critical path.
      - name: Rank the snapshots
        run: node scripts/rank-snapshots.mjs
        working-directory: apps/web
        env:
          SITE_BASE_URL: https://aleetreny.github.io/Scholar-Pulse
          # Optional and free. Unset, this is an empty string and the run falls
          # back to Semantic Scholar's anonymous pool, which is shared with every
          # other unauthenticated caller and gave three consecutive runs 86%, 64%
          # and 31% coverage of the reference lane. A key moves the build off
          # that pool. Add it at Settings > Secrets and variables > Actions.
          S2_API_KEY: ${{ secrets.S2_API_KEY }}

      - name: Build static site
        run: npm run build
        working-directory: apps/web
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
